      - name: Retain portable failure metadata without raw host diagnostics
        if: failure()
        run: |
          python3 - <<'PYCODE'
          import hashlib, json
          from pathlib import Path
          from tools.build_k02_matrix import CASES
          rows=[]
          for case in CASES:
              root=Path('build/k02-matrix-'+case)
              result=root/'result.json'
              if not result.is_file():
                  continue
              value=json.loads(result.read_bytes())
              logs=[]
              for name in ('stdout.log','stderr.log'):
                  path=root/name
                  if path.is_file():
                      raw=path.read_bytes()
                      logs.append({'path':name,'sha256':hashlib.sha256(raw).hexdigest(),'size_bytes':len(raw)})
              rows.append({'case':case,'status':value.get('status'),'returncode':value.get('execution',{}).get('returncode'),'logs':logs})
          Path('build').mkdir(exist_ok=True)
          Path('build/k02-failure-summary.json').write_text(json.dumps({'format':'tessryn-k02-failure-summary/v1','raw_output_published':False,'cases':rows},indent=2,sort_keys=True)+'\n')
          PYCODE
