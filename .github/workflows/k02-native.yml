name: K02 single-CPU native enforcement

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native-slice:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.6'
      - name: Install host QEMU build prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libglib2.0-dev ninja-build
      - name: Install fresh checksum-pinned compiler, host tests and UEFI tools
        run: |
          python3 tools/setup_toolchain.py --jobs 4
          python3 tools/setup_k02_toolchain.py
          python3 tools/setup_uefi.py
      - name: Check native tooling and design
        run: |
          python3 -m unittest discover -s tests -p 'test_k02_native_tooling.py' -v
          python3 -m unittest discover -s tests -p 'test_k02_matrix*.py' -v
          python3 tools/validate_design.py
      - name: Execute the original core, mapper and adapter host tests
        run: python3 tools/check_k02_native_host.py --out build/k02-native-host
      - name: Build the original UEFI experiment independently twice
        run: |
          python3 tools/build_k02_native.py --out build/k02-native-a
          python3 tools/build_k02_native.py --out build/k02-native-b
      - name: Exercise four fresh single-CPU user-mode cases
        run: |
          for case in own_page foreign_read kernel_read readonly_write; do
            python3 tools/run_k02_native.py --manifest build/k02-native-a/manifest.json --case "$case" --out "build/k02-native-$case"
          done
      - name: Verify twin artifacts, original instruction bindings and raw results
        run: |
          python3 tools/verify_k02_native.py --first build/k02-native-a/manifest.json --second build/k02-native-b/manifest.json \
            --result build/k02-native-own_page/result.json --result build/k02-native-foreign_read/result.json \
            --result build/k02-native-kernel_read/result.json --result build/k02-native-readonly_write/result.json \
            --out build/k02-native-verification.json
      - name: Build the complete ten-case matrix independently twice
        run: |
          python3 tools/build_k02_matrix.py --out build/k02-matrix-a
          python3 tools/build_k02_matrix.py --out build/k02-matrix-b
      - name: Execute ten fresh bounded matrix boots
        run: |
          for case in caller_forgery trusted_operation_forgery unauthorized_read read_only_sharing exact_bounds kernel_isolation data_nx recursive_revocation writable_reuse stale_identities; do
            python3 tools/run_k02_matrix.py --manifest build/k02-matrix-a/manifest.json --case "$case" --out "build/k02-matrix-$case"
          done
      - name: Independently verify clean source, twins and all ten original traces
        run: |
          python3 tools/verify_k02_matrix.py --first build/k02-matrix-a/manifest.json --second build/k02-matrix-b/manifest.json \
            --result build/k02-matrix-caller_forgery/result.json \
            --result build/k02-matrix-trusted_operation_forgery/result.json \
            --result build/k02-matrix-unauthorized_read/result.json \
            --result build/k02-matrix-read_only_sharing/result.json \
            --result build/k02-matrix-exact_bounds/result.json \
            --result build/k02-matrix-kernel_isolation/result.json \
            --result build/k02-matrix-data_nx/result.json \
            --result build/k02-matrix-recursive_revocation/result.json \
            --result build/k02-matrix-writable_reuse/result.json \
            --result build/k02-matrix-stale_identities/result.json \
            --out build/k02-matrix-verification.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success()
