name: K01 original UEFI kernel

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.6'
      - name: Install host QEMU build prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libglib2.0-dev ninja-build
      - name: Install checksum-pinned tools and UEFI profile
        run: |
          python3 tools/setup_toolchain.py --jobs 4
          python3 tools/setup_uefi.py
      - name: Check tooling and design
        run: |
          python3 -m unittest discover -s tests -v
          python3 tools/validate_design.py
      - name: Build independently twice
        run: |
          python3 tools/build_kernel.py --out build/kernel-a
          python3 tools/build_kernel.py --out build/kernel-b
      - name: Exercise boot, exceptions, panic, reset and virtual CD
        run: |
          for case in normal int3 invalid_opcode page_fault panic reboot; do
            python3 tools/run_kernel.py --manifest build/kernel-a/manifest.json --case "$case" --out "build/k01-$case"
          done
          python3 tools/run_kernel.py --manifest build/kernel-a/manifest.json --media iso --out build/k01-iso
      - name: Capture physical image display for visual inspection
        run: python3 tools/check_kernel_display.py --manifest build/kernel-a/manifest.json --out build/k01-display
      - name: Verify independent builds and retained results
        run: |
          python3 tools/verify_kernel.py --first build/kernel-a/manifest.json --second build/kernel-b/manifest.json \
            --result build/k01-normal/result.json --result build/k01-int3/result.json \
            --result build/k01-invalid_opcode/result.json --result build/k01-page_fault/result.json \
            --result build/k01-panic/result.json --result build/k01-reboot/result.json \
            --result build/k01-iso/result.json --out build/k01-verification.json
      - name: Build high-address regressions independently twice
        run: |
          python3 tools/build_kernel.py --high --out build/high-kernel-a
          python3 tools/build_kernel.py --high --out build/high-kernel-b
      - name: Exercise and verify actual high live addresses
        run: |
          results=()
          for variant in image-normal image-int3 image-page_fault image-reboot handoff-normal handoff-int3 handoff-page_fault handoff-reboot ram-only; do
            python3 tools/run_kernel_high.py --manifest build/high-kernel-a/manifest.json --variant "$variant" --out "build/k01-high-$variant"
            results+=(--result "build/k01-high-$variant/result.json")
          done
          python3 tools/verify_kernel_high.py --first build/high-kernel-a/manifest.json --second build/high-kernel-b/manifest.json \
            "${results[@]}" --out build/k01-high-verification.json
      - name: Build headless AWS inputs independently twice
        run: |
          python3 tools/build_aws_boot.py --out build/aws-a
          python3 tools/build_aws_boot.py --out build/aws-b
      - name: Exercise headless boot, faults and independent recovery locally
        run: |
          results=()
          for case in normal int3 invalid_opcode page_fault panic reboot; do
            python3 tools/run_aws_boot.py --manifest build/aws-a/manifest.json --case "$case" --out "build/aws-$case"
            results+=(--result "build/aws-$case/result.json")
          done
          python3 tools/verify_aws_boot.py --first build/aws-a/manifest.json --second build/aws-b/manifest.json \
            "${results[@]}" --out build/aws-verification.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: k01-kernel-and-evidence
          path: |
            build/kernel-a/manifest.json
            build/kernel-a/normal/BOOTX64.EFI
            build/kernel-a/normal/boot.img
            build/kernel-a/normal/boot.iso
