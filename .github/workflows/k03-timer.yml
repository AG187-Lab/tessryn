name: K03 single-CPU HPET timer and budgets

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  k03-timer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.6'
      - name: Check timer evidence and source boundaries
        run: |
          python3 -m unittest discover -s tests -p 'test_k03_timer*.py' -v
          python3 tools/validate_design.py
      - name: Install pinned compiler, host libraries and emulator
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential pkg-config libglib2.0-dev ninja-build
          python3 tools/setup_toolchain.py --jobs 4
          python3 tools/setup_k02_toolchain.py
          python3 tools/setup_uefi.py
      - name: Test original scheduler and timer adapter models
        run: python3 tools/check_k03_timer_host.py --out build/k03-timer/host
      - name: Build independent memory and scheduler integrated twins
        run: |
          python3 tools/build_k03_timer.py --out build/k03-timer/a
          python3 tools/build_k03_timer.py --out build/k03-timer/b
      - name: Capture four fresh IRQ and budget cases
        run: |
          for case in preemption budget deadline forged_irq; do
            python3 tools/run_k03_timer.py --manifest build/k03-timer/a/manifest.json --case "$case" --out "build/k03-timer/$case" --allow-qemu
          done
      - name: Verify source, twins, host receipts and original IRQ traces
        run: |
          python3 tools/verify_k03_timer.py --first build/k03-timer/a/manifest.json --second build/k03-timer/b/manifest.json \
            --host-result build/k03-timer/host/result.json --result build/k03-timer/preemption/result.json \
            --result build/k03-timer/budget/result.json --result build/k03-timer/deadline/result.json \
            --result build/k03-timer/forged_irq/result.json --out build/k03-timer/verification.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success()
        with:
          name: k03-timer-single-cpu-evidence
          include-hidden-files: true
          path: |
