name: IO01 PCI discovery

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pci-discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.6'
      - name: Test discovery evidence boundaries
        run: |
          python3 -B -m unittest discover -s tests -p 'test_io01_pci*.py' -v
          python3 tools/validate_design.py
      - name: Install pinned compiler, emulator and firmware
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential pkg-config libglib2.0-dev ninja-build
          python3 tools/setup_toolchain.py --jobs 4
          python3 tools/setup_k02_toolchain.py
          python3 tools/setup_uefi.py
      - name: Test scanner and build identical images
        run: |
          build/toolchain/bin/rustc --edition=2024 --test -D warnings kernel/io01_pci.rs -o build/io01-pci-host-tests
          build/io01-pci-host-tests
          python3 tools/build_io01_pci.py --out build/io01-pci/a
          python3 tools/build_io01_pci.py --out build/io01-pci/b
          python3 tools/build_io01_pci.py --compare build/io01-pci/a/manifest.json build/io01-pci/b/manifest.json
      - name: Cross-check the present and absent guests against paused QMP
        run: |
          status=0
          for case in present absent; do
            if python3 tools/run_io01_pci.py --manifest build/io01-pci/a/manifest.json --case "$case" --out "build/io01-pci/$case" --allow-qemu; then
              python3 tools/run_io01_pci.py --manifest build/io01-pci/a/manifest.json --case "$case" --out "build/io01-pci/$case" --verify || status=1
            else
              status=1
            fi
          done
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success()
        with:
          name: io01-pci-discovery-evidence
          path: |
            build/io01-pci/a/manifest.json
            build/io01-pci/a/BOOTX64.EFI
            build/io01-pci/a/boot.img
            build/io01-pci/a/notices/tessryn-LICENSE
            build/io01-pci/a/notices/tessryn-NOTICE
            build/io01-pci/a/notices/rust-LICENSE-APACHE
            build/io01-pci/a/notices/rust-LICENSE-MIT
            build/io01-pci/a/notices/rust-COPYRIGHT
            build/io01-pci/b/manifest.json
            build/io01-pci/b/BOOTX64.EFI
            build/io01-pci/b/boot.img
            build/io01-pci/b/notices/tessryn-LICENSE
            build/io01-pci/b/notices/tessryn-NOTICE
            build/io01-pci/b/notices/rust-LICENSE-APACHE
            build/io01-pci/b/notices/rust-LICENSE-MIT
            build/io01-pci/b/notices/rust-COPYRIGHT
            build/io01-pci/present/result.json
            build/io01-pci/present/serial.log
            build/io01-pci/present/stderr.log
            build/io01-pci/present/qmp-recv.log
            build/io01-pci/present/qmp-send.log
            build/io01-pci/absent/result.json
            build/io01-pci/absent/serial.log
            build/io01-pci/absent/stderr.log
            build/io01-pci/absent/qmp-recv.log
            build/io01-pci/absent/qmp-send.log
          if-no-files-found: error
          retention-days: 14
      - name: Test NVMe admission and build identical images
        run: |
          python3 -B -m unittest discover -s tests -p 'test_io02_nvme*.py' -v
          build/toolchain/bin/rustc --edition=2024 --test -D warnings --cfg io02_nvme_registers kernel/io01_pci.rs -o build/io02-nvme-host-tests
          build/io02-nvme-host-tests
          build/toolchain/bin/rustc --edition=2024 --test -D warnings --cfg io02_nvme_registers kernel/paging.rs -o build/io02-nvme-paging-tests
          build/io02-nvme-paging-tests
          python3 tools/build_io01_pci.py --nvme-registers --out build/io02-nvme/a
          python3 tools/build_io01_pci.py --nvme-registers --out build/io02-nvme/b
          python3 tools/build_io01_pci.py --nvme-registers --compare build/io02-nvme/a/manifest.json build/io02-nvme/b/manifest.json
      - name: Compare original NVMe register reads with paused QMP
        run: |
          status=0
          for case in present absent; do
            if python3 tools/run_io01_pci.py --nvme-registers --manifest build/io02-nvme/a/manifest.json --case "$case" --out "build/io02-nvme/$case" --allow-qemu; then
              python3 tools/run_io01_pci.py --nvme-registers --manifest build/io02-nvme/a/manifest.json --case "$case" --out "build/io02-nvme/$case" --verify || status=1
            else
              status=1
            fi
          done
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success()
        with:
          name: io02-nvme-register-evidence
          path: |
            build/io02-nvme/a/manifest.json
            build/io02-nvme/a/BOOTX64.EFI
            build/io02-nvme/a/boot.img
            build/io02-nvme/a/notices/tessryn-LICENSE
            build/io02-nvme/a/notices/tessryn-NOTICE
            build/io02-nvme/a/notices/rust-LICENSE-APACHE
            build/io02-nvme/a/notices/rust-LICENSE-MIT
            build/io02-nvme/a/notices/rust-COPYRIGHT
            build/io02-nvme/b/manifest.json
            build/io02-nvme/b/BOOTX64.EFI
            build/io02-nvme/b/boot.img
            build/io02-nvme/b/notices/tessryn-LICENSE
            build/io02-nvme/b/notices/tessryn-NOTICE
            build/io02-nvme/b/notices/rust-LICENSE-APACHE
            build/io02-nvme/b/notices/rust-LICENSE-MIT
            build/io02-nvme/b/notices/rust-COPYRIGHT
            build/io02-nvme/present/result.json
            build/io02-nvme/present/serial.log
            build/io02-nvme/present/stderr.log
            build/io02-nvme/present/qmp-recv.log
            build/io02-nvme/present/qmp-send.log
            build/io02-nvme/present/nvme-registers.bin
            build/io02-nvme/absent/result.json
            build/io02-nvme/absent/serial.log
            build/io02-nvme/absent/stderr.log
            build/io02-nvme/absent/qmp-recv.log
            build/io02-nvme/absent/qmp-send.log
          if-no-files-found: error
          retention-days: 14
      - name: Test NVMe admin queue setup and build identical images
        run: |
          python3 -B -m unittest discover -s tests -p 'test_io02_nvme_admin_trace.py' -v
          build/toolchain/bin/rustc --edition=2024 --test -D warnings --cfg io02_nvme_registers --cfg io02_nvme_admin_queues kernel/io01_pci.rs -o build/io02-admin-host-tests
          build/io02-admin-host-tests
          build/toolchain/bin/rustc --edition=2024 --test -D warnings --cfg io02_nvme_registers --cfg io02_nvme_admin_queues kernel/paging.rs -o build/io02-admin-paging-tests
          build/io02-admin-paging-tests
          python3 tools/build_io01_pci.py --nvme-admin-queues --out build/io02-admin/a
          python3 tools/build_io01_pci.py --nvme-admin-queues --out build/io02-admin/b
          python3 tools/build_io01_pci.py --nvme-admin-queues --compare build/io02-admin/a/manifest.json build/io02-admin/b/manifest.json
      - name: Cross-check NVMe admin queue teardown against paused QMP
        run: |
          status=0
          for case in present absent; do
            if python3 tools/run_io01_pci.py --nvme-admin-queues --manifest build/io02-admin/a/manifest.json --case "$case" --out "build/io02-admin/$case" --allow-qemu; then
              python3 tools/run_io01_pci.py --nvme-admin-queues --manifest build/io02-admin/a/manifest.json --case "$case" --out "build/io02-admin/$case" --verify || status=1
            else
              status=1
            fi
          done
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success()
        with:
          name: io02-nvme-admin-queue-evidence
          path: |
            build/io02-admin/a/manifest.json
            build/io02-admin/a/BOOTX64.EFI
            build/io02-admin/a/boot.img
            build/io02-admin/a/notices/tessryn-LICENSE
            build/io02-admin/a/notices/tessryn-NOTICE
            build/io02-admin/a/notices/rust-LICENSE-APACHE
            build/io02-admin/a/notices/rust-LICENSE-MIT
            build/io02-admin/a/notices/rust-COPYRIGHT
            build/io02-admin/b/manifest.json
            build/io02-admin/b/BOOTX64.EFI
            build/io02-admin/b/boot.img
            build/io02-admin/b/notices/tessryn-LICENSE
            build/io02-admin/b/notices/tessryn-NOTICE
            build/io02-admin/b/notices/rust-LICENSE-APACHE
            build/io02-admin/b/notices/rust-LICENSE-MIT
            build/io02-admin/b/notices/rust-COPYRIGHT
            build/io02-admin/present/result.json
            build/io02-admin/present/serial.log
            build/io02-admin/present/stderr.log
            build/io02-admin/present/qmp-recv.log
            build/io02-admin/present/qmp-send.log
            build/io02-admin/present/nvme-registers.bin
            build/io02-admin/present/nvme-admin-final.bin
            build/io02-admin/absent/result.json
            build/io02-admin/absent/serial.log
            build/io02-admin/absent/stderr.log
            build/io02-admin/absent/qmp-recv.log
            build/io02-admin/absent/qmp-send.log
          if-no-files-found: error
          retention-days: 14
      - name: Test VT-d admission and build identical images
        run: |
          python3 -B -m unittest discover -s tests -p 'test_io02_nvme_dma_trace.py' -v
          build/toolchain/bin/rustc --edition=2024 --test -D warnings kernel/io02_vtd.rs -o build/io02-vtd-host-tests
          build/io02-vtd-host-tests
          build/toolchain/bin/rustc --edition=2024 --test -D warnings kernel/io02_vtd_acpi.rs -o build/io02-vtd-acpi-tests
          build/io02-vtd-acpi-tests
          build/toolchain/bin/rustc --edition=2024 --test -D warnings --cfg io02_nvme_registers --cfg io02_nvme_admin_queues --cfg io02_nvme_dma_isolation kernel/paging.rs -o build/io02-vtd-paging-tests
          build/io02-vtd-paging-tests
          python3 tools/build_io01_pci.py --nvme-dma-isolation --out build/io02-vtd/a
          python3 tools/build_io01_pci.py --nvme-dma-isolation --out build/io02-vtd/b
          python3 tools/build_io01_pci.py --nvme-dma-isolation --compare build/io02-vtd/a/manifest.json build/io02-vtd/b/manifest.json
      - name: Compare VT-d setup and capability refusal against paused QMP
        run: |
          status=0
          for case in present blocked; do
            if python3 tools/run_io01_pci.py --nvme-dma-isolation --manifest build/io02-vtd/a/manifest.json --case "$case" --out "build/io02-vtd/$case" --allow-qemu; then
              python3 tools/run_io01_pci.py --nvme-dma-isolation --manifest build/io02-vtd/a/manifest.json --case "$case" --out "build/io02-vtd/$case" --verify || status=1
            else
              status=1
            fi
          done
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success()
        with:
          name: io02-nvme-vtd-setup-evidence
          path: |
            build/io02-vtd/a/manifest.json
            build/io02-vtd/a/BOOTX64.EFI
            build/io02-vtd/a/boot.img
            build/io02-vtd/a/notices/tessryn-LICENSE
            build/io02-vtd/a/notices/tessryn-NOTICE
            build/io02-vtd/a/notices/rust-LICENSE-APACHE
            build/io02-vtd/a/notices/rust-LICENSE-MIT
            build/io02-vtd/a/notices/rust-COPYRIGHT
            build/io02-vtd/b/manifest.json
            build/io02-vtd/b/BOOTX64.EFI
            build/io02-vtd/b/boot.img
            build/io02-vtd/b/notices/tessryn-LICENSE
            build/io02-vtd/b/notices/tessryn-NOTICE
            build/io02-vtd/b/notices/rust-LICENSE-APACHE
            build/io02-vtd/b/notices/rust-LICENSE-MIT
            build/io02-vtd/b/notices/rust-COPYRIGHT
            build/io02-vtd/present/result.json
            build/io02-vtd/present/serial.log
            build/io02-vtd/present/stderr.log
            build/io02-vtd/present/qmp-recv.log
            build/io02-vtd/present/qmp-send.log
            build/io02-vtd/present/nvme-registers.bin
            build/io02-vtd/present/nvme-admin-final.bin
            build/io02-vtd/present/vtd-state.bin
            build/io02-vtd/present/vtd-tables.bin
            build/io02-vtd/blocked/result.json
            build/io02-vtd/blocked/serial.log
            build/io02-vtd/blocked/stderr.log
            build/io02-vtd/blocked/qmp-recv.log
            build/io02-vtd/blocked/qmp-send.log
            build/io02-vtd/blocked/nvme-registers.bin
            build/io02-vtd/blocked/nvme-admin-final.bin
            build/io02-vtd/blocked/vtd-state.bin
          if-no-files-found: error
          retention-days: 14
