            build/k03-smp/b/sources/tools/k01_media.py
            build/k03-smp/b/sources/tools/k02_region_protocol.py
            build/k03-smp/b/sources/tools/k03_smp_protocol.py
            build/k03-smp/b/sources/tools/k03_smp_provenance.py
            build/k03-smp/b/sources/tools/k03_smp_trace.py
            build/k03-smp/b/sources/tools/run_k03_smp.py
            build/k03-smp/b/sources/tools/setup_k02_toolchain.py
            build/k03-smp/b/sources/tools/setup_toolchain.py
            build/k03-smp/b/sources/tools/setup_uefi.py
            build/k03-smp/b/sources/tools/summarize_k03_smp_failure.py
            build/k03-smp/b/sources/tools/verify_k03_smp.py
            build/k03-smp/b/sources/uefi-toolchain.lock.json
            build/k03-smp/rendezvous/result.json
            build/k03-smp/rendezvous/registration.json
            build/k03-smp/rendezvous/stdout.log
            build/k03-smp/rendezvous/stderr.log
            build/k03-smp/rendezvous/firmware/code.fd
            build/k03-smp/rendezvous/firmware/vars.fd
            build/k03-smp/rendezvous/firmware/NOTICE
            build/k03-smp/missing_ap/result.json
            build/k03-smp/missing_ap/registration.json
            build/k03-smp/missing_ap/stdout.log
            build/k03-smp/missing_ap/stderr.log
            build/k03-smp/missing_ap/firmware/code.fd
            build/k03-smp/missing_ap/firmware/vars.fd
            build/k03-smp/missing_ap/firmware/NOTICE
            build/k03-smp/host/result.json
            build/k03-smp/host/build-stdout.log
            build/k03-smp/host/build-stderr.log
            build/k03-smp/host/tests-stdout.log
            build/k03-smp/host/tests-stderr.log
            build/k03-smp/verification.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain portable failure metadata
        if: failure()
        run: python3 tools/summarize_k03_smp_failure.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: k03-smp-failure-metadata
          path: build/k03-smp/failure-summary.json
          if-no-files-found: warn
          retention-days: 14
