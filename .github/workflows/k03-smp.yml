            build/k03-smp/b/sources/kernel/smp_acpi.rs
            build/k03-smp/b/sources/kernel/smp_entry.S
            build/k03-smp/b/sources/kernel/uefi.rs
            build/k03-smp/b/sources/planning/k02-toolchain.lock.json
            build/k03-smp/b/sources/planning/k03-smp.json
            build/k03-smp/b/sources/tests/k03_smp_acpi.rs
            build/k03-smp/b/sources/toolchain.lock.json
            build/k03-smp/b/sources/tools/build_fixture.py
            build/k03-smp/b/sources/tools/build_k03_smp.py
            build/k03-smp/b/sources/tools/build_kernel.py
            build/k03-smp/b/sources/tools/check_k03_smp_host.py
            build/k03-smp/b/sources/tools/g03/__init__.py
