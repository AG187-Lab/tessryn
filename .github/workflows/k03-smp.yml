            build/k03-smp/b/missing_ap/boot.img
            build/k03-smp/b/missing_ap/stdout.log
            build/k03-smp/b/missing_ap/stderr.log
            build/k03-smp/b/notices/tessryn-LICENSE
            build/k03-smp/b/notices/tessryn-NOTICE
            build/k03-smp/b/notices/rust-LICENSE-APACHE
            build/k03-smp/b/notices/rust-LICENSE-MIT
            build/k03-smp/b/notices/rust-COPYRIGHT
            build/k03-smp/b/sources/.github/workflows/k03-smp.yml
            build/k03-smp/b/sources/fixtures/rom.py
            build/k03-smp/b/sources/kernel/cpu.rs
