name: K02 resumable region service

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  region-service:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.6'
      - name: Check region wire, capture and evidence boundaries
        run: |
          python3 -m unittest discover -s tests -p 'test_k02_region*.py' -v
          python3 tools/validate_design.py
      - name: Install compiler, host libraries and pinned UEFI emulator
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential pkg-config libglib2.0-dev ninja-build
          python3 tools/setup_toolchain.py --jobs 4
          python3 tools/setup_k02_toolchain.py
          python3 tools/setup_uefi.py
      - name: Test reusable policy against the original ownership core
        run: python3 tools/check_k02_region_host.py --out build/k02-region-service/host
      - name: Build complete original-kernel scenarios independently twice
        run: |
          python3 tools/build_k02_region_service.py --out build/k02-region-service/a
          python3 tools/build_k02_region_service.py --out build/k02-region-service/b
      - name: Capture three fresh resumable two-program executions
        run: |
          for case in sharing revocation authority; do
            python3 tools/run_k02_region_service.py --manifest build/k02-region-service/a/manifest.json --case "$case" --out "build/k02-region-service/$case" --allow-qemu
          done
      - name: Independently verify source, twins and all raw contexts
        run: |
          python3 tools/verify_k02_region_service.py --first build/k02-region-service/a/manifest.json --second build/k02-region-service/b/manifest.json \
            --result build/k02-region-service/sharing/result.json --result build/k02-region-service/revocation/result.json \
            --result build/k02-region-service/authority/result.json --host-result build/k02-region-service/host/result.json \
            --out build/k02-region-service/verification.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success()
        with:
          name: k02-region-service-single-cpu-evidence
          include-hidden-files: true
          path: |
            build/k02-region-service/a/manifest.json
            build/k02-region-service/a/libtessryn_owned_memory.rlib
            build/k02-region-service/a/core-stdout.log
            build/k02-region-service/a/core-stderr.log
            build/k02-region-service/a/sharing/BOOTX64.EFI
            build/k02-region-service/a/sharing/boot.img
            build/k02-region-service/a/sharing/kernel.obj
            build/k02-region-service/a/sharing/sharing-stdout.log
            build/k02-region-service/a/sharing/sharing-stderr.log
