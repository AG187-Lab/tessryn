name: Design integrity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  design-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate documents and planning contracts
        run: python3 tools/validate_design.py
