name: K03 two-CPU LAPIC preemption and aggregate budget

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  k03-smp-budget:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.6'
      - name: Check budget evidence boundaries
        run: |
          python3 -m unittest discover -s tests -p 'test_k03_smp_budget*.py' -v
          python3 tools/validate_design.py
      - name: Install pinned compiler, host libraries and emulator
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential pkg-config libglib2.0-dev ninja-build
          python3 tools/setup_toolchain.py --jobs 4
          python3 tools/setup_k02_toolchain.py
          python3 tools/setup_uefi.py
      - name: Execute the actual ACPI parser host tests
        run: python3 tools/check_k03_smp_user_host.py --out build/k03-smp-budget/host
      - name: Build independent budget twins and pinned scheduler libraries
        run: |
          python3 tools/k03_smp_budget.py build --out build/k03-smp-budget/a
          python3 tools/k03_smp_budget.py build --out build/k03-smp-budget/b
      - name: Capture both local timers, contended reservations and actual late stops
        run: |
          for case in preempt late; do
            python3 tools/k03_smp_budget.py run --manifest build/k03-smp-budget/a/manifest.json --case "$case" --out "build/k03-smp-budget/$case" --allow-qemu
          done
      - name: Replay compiled binding, actual traps and the complete shared ledger
        run: |
          python3 tools/k03_smp_budget.py verify --first build/k03-smp-budget/a/manifest.json --second build/k03-smp-budget/b/manifest.json --host-result build/k03-smp-budget/host/result.json \
            --result build/k03-smp-budget/preempt/result.json --result build/k03-smp-budget/late/result.json --out build/k03-smp-budget/verification.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success()
        with:
          name: k03-smp-budget-evidence
          include-hidden-files: true
          path: |
            build/k03-smp-budget/a/manifest.json
            build/k03-smp-budget/a/libtessryn_scheduler.rlib
