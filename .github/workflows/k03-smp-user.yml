name: K03 two-CPU isolated CPL3 execution

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  k03-smp-user:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.6'
      - name: Check isolated user evidence boundaries
        run: |
          python3 -m unittest discover -s tests -p 'test_k03_smp_user*.py' -v
          python3 tools/validate_design.py
      - name: Install pinned compiler, host libraries and emulator
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential pkg-config libglib2.0-dev ninja-build
          python3 tools/setup_toolchain.py --jobs 4
          python3 tools/setup_k02_toolchain.py
          python3 tools/setup_uefi.py
      - name: Execute the actual ACPI parser host tests
        run: python3 tools/check_k03_smp_user_host.py --out build/k03-smp-user/host
      - name: Build independent isolated user twins
        run: |
          python3 tools/build_k03_smp_user.py --out build/k03-smp-user/a
          python3 tools/build_k03_smp_user.py --out build/k03-smp-user/b
      - name: Capture simultaneous progress and actual protection faults
        run: |
          for case in rendezvous peer_read forged_ipi; do
            python3 tools/run_k03_smp_user.py --manifest build/k03-smp-user/a/manifest.json --case "$case" --out "build/k03-smp-user/$case" --allow-qemu
          done
      - name: Verify source, twins, host receipts and original CPL3 traces
        run: |
          python3 tools/verify_k03_smp_user.py --first build/k03-smp-user/a/manifest.json --second build/k03-smp-user/b/manifest.json --host-result build/k03-smp-user/host/result.json \
            --result build/k03-smp-user/rendezvous/result.json --result build/k03-smp-user/peer_read/result.json --result build/k03-smp-user/forged_ipi/result.json --out build/k03-smp-user/verification.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success()
        with:
          name: k03-smp-user-evidence
          include-hidden-files: true
          path: |
            build/k03-smp-user/a/manifest.json
            build/k03-smp-user/a/rendezvous/BOOTX64.EFI
            build/k03-smp-user/a/rendezvous/kernel.obj
            build/k03-smp-user/a/rendezvous/boot.img
            build/k03-smp-user/a/rendezvous/stdout.log
            build/k03-smp-user/a/rendezvous/stderr.log
            build/k03-smp-user/a/peer_read/BOOTX64.EFI
            build/k03-smp-user/a/peer_read/kernel.obj
            build/k03-smp-user/a/peer_read/boot.img
