name: Platform inventory tooling

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  platform-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12.13'
      - name: Test inventory boundaries
        run: python3 -m unittest discover -s tests -v
      - name: Collect hosted Linux reference facts
        run: |
          mkdir -p build
          timeout --signal=TERM --kill-after=2s 30s python3 tools/collect_platform_inventory.py --public-summary --out build/ci-linux-reference.json
          sha256sum tools/collect_platform_inventory.py build/ci-linux-reference.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('build/ci-linux-reference.json').read_text())
          assert report['evidence_kind'] == 'linux_reference_inventory'
          assert report['publication_profile'] == 'numeric_summary'
          assert report['support_status'] == 'unqualified'
          assert all(item['status'] == 'unavailable' for item in report['tessryn_capabilities'].values())
          assert report['measured_admission']['status'] == 'unknown'
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: g01-ci-linux-reference
          path: build/ci-linux-reference.json
          retention-days: 14
          if-no-files-found: error
